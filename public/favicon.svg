<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle border ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />

  <!-- Shield Shape in Center -->
  <path d="M256 80 L390 135 C390 270 256 380 256 380 C256 380 122 270 122 135 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" />

  <!-- Currency / Cashback Symbol & Star -->
  <circle cx="256" cy="205" r="64" fill="url(#starGrad)" filter="url(#glow)" />
  <path d="M256 165 L267 192 L296 195 L274 214 L281 242 L256 227 L231 242 L238 214 L216 195 L245 192 Z" fill="#ffffff" />

  <!-- TBC Bold Monogram -->
  <text x="256" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">TBC</text>

  <!-- WMS Pill Badge -->
  <rect x="186" y="415" width="140" height="42" rx="21" fill="#10b981" />
  <text x="256" y="443" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="3">WMS</text>
</svg>
