    <script>
      (function() {
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _fetchHandler = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetchHandler;
            },
            set: function(val) {
              _fetchHandler = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
